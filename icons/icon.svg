<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">VDT Calculator</title>
  <desc id="desc">Simplified lungs with a solid pulmonary nodule and a larger dashed ring showing future growth.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="44" x2="438" y2="468" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17364D"/>
      <stop offset="1" stop-color="#176B73"/>
    </linearGradient>
    <linearGradient id="lung" x1="180" y1="170" x2="330" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDEBEC"/>
    </linearGradient>
    <radialGradient id="nodule" cx="0" cy="0" r="1" gradientTransform="translate(320 278) rotate(48) scale(28)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD59F"/>
      <stop offset=".42" stop-color="#F5A65B"/>
      <stop offset="1" stop-color="#E8833D"/>
    </radialGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0A2636" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#background)"/>
  <path d="M0 0h512v164C409 104 303 78 195 91 118 101 54 128 0 166V0Z" fill="#FFFFFF" fill-opacity=".035"/>

  <g filter="url(#soft-shadow)">
    <path d="M229 179c-24-12-51 2-71 29-25 34-36 86-26 130 7 33 25 52 50 52 27 0 47-24 56-58 7-27 4-57 5-86 1-31 4-57-14-67Z" fill="url(#lung)"/>
    <path d="M283 179c24-12 51 2 71 29 25 34 36 86 26 130-7 33-25 52-50 52-27 0-47-24-56-58-7-27-4-57-5-86-1-31-4-57 14-67Z" fill="url(#lung)"/>
  </g>

  <path d="M256 118v86m0-4c-5 18-21 29-41 42m41-42c5 18 21 29 41 42" fill="none" stroke="#C8DFE1" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M256 118v82" fill="none" stroke="#F8FCFC" stroke-width="9" stroke-linecap="round"/>

  <circle cx="326" cy="286" r="40" fill="#F5A65B" fill-opacity=".07" stroke="#F7B66F" stroke-width="7" stroke-linecap="round" stroke-dasharray="7 12"/>
  <circle cx="326" cy="286" r="16" fill="url(#nodule)"/>
  <circle cx="321" cy="280" r="4" fill="#FFF0DC" fill-opacity=".78"/>
</svg>
