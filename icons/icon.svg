<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">VDT Calculator</title>
  <desc id="desc">A pulmonary nodule inside a scanner ring with a rising doubling-time curve.</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="48" x2="440" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1F3A"/>
      <stop offset="0.55" stop-color="#0C5270"/>
      <stop offset="1" stop-color="#0A8F86"/>
    </linearGradient>
    <linearGradient id="curve" x1="142" y1="354" x2="390" y2="151" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8BE1D6"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00101D" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
  <path d="M106 256a150 150 0 0 1 263-99" fill="none" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="28" stroke-linecap="round"/>
  <path d="M406 256a150 150 0 0 1-263 99" fill="none" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="28" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="76" fill="#FFFFFF" fill-opacity=".10" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="5"/>
  <circle cx="256" cy="256" r="29" fill="#FFB454" filter="url(#shadow)"/>
  <circle cx="247" cy="246" r="8" fill="#FFE1B5" fill-opacity=".78"/>
  <path d="M132 365c49-2 78-10 105-33 26-22 42-54 66-76 24-22 51-34 88-35" fill="none" stroke="#001E31" stroke-opacity=".32" stroke-width="20" stroke-linecap="round"/>
  <path d="M132 353c49-2 78-10 105-33 26-22 42-54 66-76 24-22 51-34 88-35" fill="none" stroke="url(#curve)" stroke-width="13" stroke-linecap="round"/>
  <circle cx="132" cy="353" r="14" fill="#8BE1D6"/>
  <circle cx="237" cy="320" r="14" fill="#B7EEE8"/>
  <circle cx="303" cy="244" r="14" fill="#D7F7F3"/>
  <circle cx="391" cy="209" r="16" fill="#FFFFFF"/>
</svg>
