<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">VDT Calculator</title>
  <desc id="desc">Two pulmonary nodule measurements progressing inside a CT scanner ring.</desc>
  <defs>
    <linearGradient id="background" x1="72" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17364D"/>
      <stop offset="1" stop-color="#176B73"/>
    </linearGradient>
    <filter id="nodule-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0D2A38" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#background)"/>
  <circle cx="256" cy="256" r="142" fill="#FFFFFF" fill-opacity=".045" stroke="#FFFFFF" stroke-opacity=".82" stroke-width="18"/>
  <circle cx="256" cy="256" r="98" fill="none" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="3"/>
  <path d="M231 269l38-20" fill="none" stroke="#BFDCDD" stroke-width="8" stroke-linecap="round"/>
  <circle cx="205" cy="278" r="25" fill="#E3AE61" fill-opacity=".78"/>
  <circle cx="313" cy="226" r="41" fill="#F1B45B" filter="url(#nodule-shadow)"/>
  <circle cx="301" cy="213" r="9" fill="#FFE3B7" fill-opacity=".68"/>
</svg>
